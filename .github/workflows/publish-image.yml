name: Publish Docker image

on:
  push:
    branches: [master, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_NAMESPACE: >-
    ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
  IMAGE_REPOSITORY: openplc-studio-backend
  INFRA_REPOSITORY: >-
    ${{ vars.INFRA_REPOSITORY || 'filippodaniotti/openplc-studio-infra' }}

jobs:
  tests:
    name: Run tests
    uses: ./.github/workflows/tests.yml

  publish:
    name: Build and publish
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # yamllint disable-line rule:line-length
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: >-
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'master' }}
            type=raw,value=prod,enable=${{ github.ref_name == 'master' }}
            type=raw,value=staging,enable=${{ github.ref_name == 'staging' }}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.title=PLC Platform Backend
            org.opencontainers.image.description=OpenPLC Studio backend

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: .docker/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish Docker Hub README
        if: github.ref == 'refs/heads/master'
        # yamllint disable-line rule:line-length
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa
        with:
          # This user must be a Docker Hub repository Admin in the CIMIL org.
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          # PAT requires Docker Hub read, write, and delete scopes.
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}
          short-description: OpenPLC Studio backend
          readme-filepath: ./README.md

      - name: Record desired image in private infrastructure repository
        if: github.ref_name == 'master' || github.ref_name == 'staging'
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: >-
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          payload="$(jq -n \
            --arg component backend \
            --arg branch "${SOURCE_BRANCH}" \
            --arg image_repository "${IMAGE_NAME}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg source_sha "${SOURCE_SHA}" \
            '{event_type:"image_published",client_payload:{component:$component,branch:$branch,image_repository:$image_repository,digest:$digest,source_sha:$source_sha}}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${INFRA_REPOSITORY}/dispatches" \
            --data "${payload}"
